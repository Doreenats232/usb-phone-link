<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="ui-version" content="2"><title>USB Link</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14141f;color:#eee;font:16px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#1c1c2b}
.dot{width:12px;height:12px;border-radius:50%;background:#888}.dot.on{background:#3ddc84}.dot.off{background:#e55}
header b{flex:1}button{border:0;border-radius:12px;background:#2a2a40;color:#eee;padding:10px 14px;font-size:15px}
#log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:#7c5cf0}.ai{align-self:flex-start;background:#26263a}.sys{align-self:center;color:#999;font-size:13px}
#bar{display:flex;gap:8px;padding:10px;background:#1c1c2b;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#t{flex:1;border:0;border-radius:20px;background:#2a2a40;color:#fff;padding:12px 16px;font-size:16px;outline:none}
#mic{width:52px;height:52px;border-radius:50%;background:#7c5cf0;font-size:22px;padding:0}#mic.rec{background:#e55}
#send{background:#7c5cf0}
#set{position:fixed;inset:0;background:#14141f;padding:20px;display:none;flex-direction:column;gap:10px;padding-top:calc(20px + env(safe-area-inset-top))}
#set label{color:#aaa;font-size:14px}#set input{border:0;border-radius:10px;background:#2a2a40;color:#fff;padding:12px;font-size:16px}
</style></head><body>
<header><div class="dot" id="dot"></div><b>USB Link <span id="st" style="font-weight:400;color:#999;font-size:13px"></span></b><button id="bSet">Settings</button></header>
<div id="log"></div>
<div id="bar"><button id="mic">🎤</button><input id="t" placeholder="Tell the USB what to do…"><button id="send">Send</button></div>
<div id="set">
<h2>Settings</h2>
<label>Server address</label><input id="url" placeholder="https://your-link.onrender.com" autocapitalize="off">
<label>Pairing code (same one on the USB Desktop, 8+ characters)</label><input id="code" autocapitalize="off">
<label><input type="checkbox" id="speak"> Read answers out loud</label>
<div style="display:flex;gap:8px"><button id="save" style="background:#7c5cf0">Save</button><button id="clear">Clear chat</button></div>
</div>
<script>
const $=id=>document.getElementById(id), L=localStorage;
const UIV=2, DEF="https://usb-phone-link.onrender.com";
const cap=window.Capacitor, SR=cap&&cap.Plugins&&cap.Plugins.SpeechRecognition;
let busy=false, listening=false, heard='';
const cfg=()=>({url:(L.url||DEF).trim().replace(/\/$/,''),code:(L.code||'').trim()});
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9;saveLog()}
function saveLog(){L.log=JSON.stringify([...$('log').children].filter(e=>e.textContent!=='···').slice(-60).map(e=>[e.className.replace('m ',''),e.textContent]))}
try{JSON.parse(L.log||'[]').forEach(([c,t])=>{const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('log').appendChild(d)})}catch{}
async function api(path,opt={}){const {url,code}=cfg();if(!url||code.length<8)throw new Error('Open Settings: add the server address and an 8+ character pairing code.');
  const r=await fetch(url+path,{...opt,headers:{'x-pair':code,'content-type':'application/json'}});const j=await r.json();if(!r.ok)throw new Error(j.error||('Error '+r.status));return j}
async function status(){try{const s=await api('/api/status');$('dot').className='dot '+(s.usbOnline?'on':'off');$('st').textContent=s.usbOnline?'USB online':'USB not connected'}catch(e){$('dot').className='dot';$('st').textContent=''}}
async function send(text){
  text=(text||'').trim();if(!text||busy)return;busy=true;$('t').value='';add(text,'me');let ty=null;
  try{
    const {id}=await api('/api/send',{method:'POST',body:JSON.stringify({text})});
    const start=Date.now();let note=false;ty=document.createElement('div');ty.className='m ai';ty.textContent='···';$('log').appendChild(ty);$('log').scrollTop=1e9;
    while(Date.now()-start<5*60e3){
      const r=await api('/api/result?id='+encodeURIComponent(id));
      if(r.done){ty&&ty.remove();add(r.text,'ai');if(L.speak==='1')try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(r.text))}catch{};break}
      if(!r.usbOnline&&!note){note=true;add('USB Desktop is not connected. Open it on the PC (Settings → Phone link → On).','sys')}
    }
  }catch(e){try{ty&&ty.remove()}catch{};add('⚠ '+e.message,'sys')}
  busy=false;status();
}
$('send').onclick=()=>send($('t').value);$('t').onkeydown=e=>{if(e.key==='Enter')send($('t').value)};
async function toggleMic(){
  if(!SR){add('Voice needs the Android app.','sys');return}
  if(listening){try{await SR.stop()}catch{}return}
  try{
    const p=await SR.requestPermissions();if(p.speechRecognition&&p.speechRecognition!=='granted'){add('Allow the microphone for USB Link in Android settings.','sys');return}
    heard='';listening=true;$('mic').classList.add('rec');
    await SR.start({language:'en-US',partialResults:true,popup:false,maxResults:1});
  }catch(e){listening=false;$('mic').classList.remove('rec');add('Mic error: '+(e.message||e),'sys')}
}
if(SR){SR.addListener('partialResults',d=>{if(d.matches&&d.matches[0]){heard=d.matches[0];$('t').value=heard}});
  SR.addListener('listeningState',d=>{if(d.status==='stopped'){listening=false;$('mic').classList.remove('rec');if(heard)send(heard);heard=''}})}
$('mic').onclick=toggleMic;
$('bSet').onclick=()=>{$('url').value=L.url||'';$('code').value=L.code||'';$('speak').checked=L.speak==='1';$('set').style.display='flex'};
$('save').onclick=()=>{L.url=$('url').value.trim();L.code=$('code').value.trim();L.speak=$('speak').checked?'1':'0';$('set').style.display='none';status()};
$('clear').onclick=()=>{$('log').innerHTML='';saveLog()};
if(!cfg().url)add('Welcome! Tap Settings, add your server address and a pairing code, then tap 🎤 and talk.','sys');
status();setInterval(status,20000);
// ---- updates: UI hot-updates from the server (no new APK), native updates via the release page ----
const B=+'__BUILD__';if(B)L.build=B;
function applyHot(h){L.uiTry='1';document.open();document.write(h);document.close()}
setTimeout(()=>{L.uiTry=''},4000);
async function checkUpdates(){
  try{const u=cfg().url;const r=await fetch(u+'/ui.html',{cache:'no-store'});if(r.ok){const h=await r.text();const m=h.match(/ui-version" content="(\d+)"/);
    if(m&&+m[1]>Math.max(UIV,+L.uiVer||0)&&h.includes('</html>')){L.uiHtml=h;L.uiVer=m[1];if(!window.__hot){window.__hot=1;applyHot(h);return}}}}catch{}
  try{const r=await fetch('https://api.github.com/repos/Doreenats232/usb-phone-link/releases/latest');const j=await r.json();const n=+(String(j.tag_name||'').split('.').pop());
    if(n&&L.build&&n>+L.build&&!$('upd')){const d=document.createElement('div');d.id='upd';d.className='m sys';d.style.cssText='background:#2a2a40;padding:10px 14px;border-radius:12px';d.innerHTML='New app version available. <u style="color:#9d86ff">Tap to download</u>';
      d.onclick=()=>{location.href='https://github.com/Doreenats232/usb-phone-link/releases/download/'+j.tag_name+'/UsbLink.apk'};$('log').appendChild(d)}}catch{}
}
setTimeout(checkUpdates,1500);

</script><script>
window.addEventListener('load',()=>{try{const L=localStorage,UIV=2;
  if(L.uiTry==='1'){L.uiHtml='';L.uiVer='';L.uiTry=''}   // last hot UI never started: drop it
  if(L.uiHtml&&(+L.uiVer||0)>UIV&&!window.__hot){window.__hot=1;L.uiTry='1';document.open();document.write(L.uiHtml);document.close()}}catch{}});
</script>
</body></html>
