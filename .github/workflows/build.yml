name: build-apk
on:
  push:
    branches: [main]
    paths: ['app/package.json', 'app/capacitor.config.json', 'app/icon/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install and add Android
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Permissions and speech service
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n</manifest>#' $M
          grep -q "RecognitionService" $M || sed -i 's#</manifest>#    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n</manifest>#' $M
          grep -q USE_BIOMETRIC $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>#' $M
          grep -q REQUEST_INSTALL_PACKAGES $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M
          cat $M
      - name: Robot icon and build number
        working-directory: app
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp icon/mipmap-$d/*.png $R/mipmap-$d/; done
          sed -i "s/__BUILD__/${{ github.run_number }}/" android/app/src/main/assets/public/index.html
          grep -c "'${{ github.run_number }}'" android/app/src/main/assets/public/index.html || true
      - name: Stable signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp app/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk UsbLink.apk
          gh release create "v1.0.${{ github.run_number }}" UsbLink.apk --title "USB Link v1.0.${{ github.run_number }}" --notes "Install UsbLink.apk on your phone."
